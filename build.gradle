buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://files.minecraftforge.net/maven" }
        maven { url = 'https://repo.spongepowered.org/maven' }        
    }
    dependencies {
        classpath files('forgegradle/ForgeGradle-2.3.8.jar')
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
//        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'
//apply plugin: 'net.minecraftforge.gradle'
//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group
archivesBaseName = mod_id

sourceCompatibility = targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

configurations {
    embed
    compile.extendsFrom(embed)
}

minecraft {
    version = "${minecraft_version}-${forge_version}"
    runDir = 'run'
    mappings = mappings_version
    def args = []
    args <<  "-Dfml.coreMods.load=com.qdd.narutofix.core.FixPlugin"
    args << '-Dmixin.hotSwap=true'
    args << '-Dmixin.checks.interfaces=true'
    args << '-Dmixin.debug.export=true'
    clientJvmArgs.addAll(args)
    serverJvmArgs.addAll(args)
   }

repositories {
    maven {
        url = "https://cursemaven.com"
    }
    maven {
        url = 'https://maven.cleanroommc.com'
    }
    mavenCentral()
    maven { url = "https://repo.spongepowered.org/maven" }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {
    compile 'com.cleanroommc:assetmover:2.0'
    compile 'zone.rong:mixinbooter:7.0'
    deobfCompile "curse.maven:ahznbs-naruto-mod-831157:5967126"

}

sourceSets {

    main {
        ext.refMap = mod_mixin_refmap.replace('${mod_id}', mod_id)
    }

}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        expand 'mod_id': mod_id, 'mod_name': mod_name, 'version': project.version,
                'mcversion': minecraft_version, 'mod_description': mod_description,
                'mod_author': mod_author
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
    rename '(.+_at.cfg)', 'META-INF/$1'
}



jar {
    manifest {
        def attribute_map = [:]
        attribute_map['FMLCorePlugin'] = 'com.qdd.narutofix.core.FixPlugin'
        attribute_map['FMLCorePluginContainsFMLMod'] = true
        attribute_map['ForceLoadAsMod'] = project.gradle.startParameter.taskNames[0] == "build"
        attribute_map['FMLAT'] = 'narutofix_at.cfg'

        attributes(attribute_map)
    }
}

