plugins {
    id 'java'
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
    id 'com.diffplug.spotless' version '7.2.1'
    id 'com.github.ben-manes.versions' version '0.51.0'
}

ext.propertyString = { String key -> providers.gradleProperty(key).get() }
ext.propertyBool = { String key -> propertyString(key).toBoolean() }
ext.propertyStringList = { String key ->
    String value = providers.gradleProperty(key).orElse('').get().trim()
    value.isEmpty() ? [] : value.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}

version = propertyString('mod_version')
group = propertyString('mod_group_id')

base {
    archivesName = propertyString('mod_id')
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
    withSourcesJar()
    withJavadocJar()
}

minecraft {
    mcVersion = propertyString('minecraft_version')
    mcpMappingChannel = propertyString('mcp_mapping_channel')
    mcpMappingVersion = propertyString('mcp_mapping_version')
    username = 'Developer'
    useDependencyAccessTransformers = true

    extraRunJvmArguments.addAll(propertyStringList('extra_jvm_args'))

    if (propertyBool('is_coremod')) {
        extraRunJvmArguments.add("-Dfml.coreMods.load=${propertyString('coremod_plugin_class_name')}")
    }

    if (propertyBool('use_mixins')) {
        propertyStringList('mixin_configs').each { config ->
            extraRunJvmArguments.add("-Dmixin.config=mixins.${config}.json")
        }
        extraRunJvmArguments.addAll([
                '-Dmixin.hotSwap=true',
                '-Dmixin.checks.interfaces=true',
                '-Dmixin.debug.export=true'
        ])
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = uri('https://cursemaven.com')
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'CleanroomMC Maven'
        url = uri('https://maven.cleanroommc.com')
    }
    maven {
        name = 'SpongePowered Maven'
        url = uri('https://repo.spongepowered.org/maven')
    }
    mavenCentral()
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

apply from: 'gradle/scripts/dependencies.gradle'

sourceSets {
    main {
        ext.refMap = propertyString('mixin_refmap')
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', propertyString('mod_id')
    inputs.property 'mod_name', propertyString('mod_name')
    inputs.property 'mod_version', propertyString('mod_version')
    inputs.property 'mod_description', propertyString('mod_description')
    inputs.property 'mod_authors', propertyString('mod_authors')
    inputs.property 'minecraft_version', propertyString('minecraft_version')
    inputs.property 'mcversion', propertyString('minecraft_version')
    inputs.property 'mixin_refmap', propertyString('mixin_refmap')
    inputs.property 'mixin_package', propertyString('mixin_package')

    filesMatching(['mcmod.info', 'pack.mcmeta', 'mixins.*.json']) {
        expand(
                'version': project.version,
                'mod_id': propertyString('mod_id'),
                'mod_name': propertyString('mod_name'),
                'mod_version': propertyString('mod_version'),
                'mod_description': propertyString('mod_description'),
                'mod_authors': propertyString('mod_authors'),
                'minecraft_version': propertyString('minecraft_version'),
                'mcversion': propertyString('minecraft_version'),
                'mixin_refmap': propertyString('mixin_refmap'),
                'mixin_package': propertyString('mixin_package')
        )
    }

    rename '(.+_at.cfg)', 'META-INF/$1'
}

jar {
    manifest {
        def attributesMap = [:]
        if (propertyBool('use_access_transformer')) {
            attributesMap['FMLAT'] = propertyString('access_transformer_locations')
        }
        if (propertyBool('is_coremod')) {
            attributesMap['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
            attributesMap['FMLCorePluginContainsFMLMod'] = 'true'
            attributesMap['ForceLoadAsMod'] = 'true'
        }
        if (propertyBool('use_mixins')) {
            attributesMap['MixinConfigs'] = propertyStringList('mixin_configs').collect { "mixins.${it}.json" }.join(',')
        }
        attributes(attributesMap)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = propertyString('mod_id')
        }
    }
}
